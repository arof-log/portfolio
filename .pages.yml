media:
  input: images
  output: /images

content:
  - name: works
    label: Works
    type: file
    path: data/works.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: id
        label: ID / Slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: title
        label: 작품명
        type: string
        required: true
      - name: category
        label: 카테고리
        type: string
        required: true
      - name: year
        label: 연도
        type: string
      - name: thumbnail
        label: 대표 이미지
        type: image
        required: true
      - name: description
        label: 간단한 설명
        type: text
      - name: detailPage
        label: 상세 페이지 주소
        type: string
        description: "예: detail-branding.html 또는 details/branding.html"
      - name: published
        label: 공개 여부
        type: boolean
        default: true
      - name: featured
        label: 메인 노출
        type: boolean
        default: false
      - name: order
        label: 노출 순서
        type: number
        required: true

  - name: guestbook
    label: Guestbook
    type: collection
    path: content/guestbook
    format: yaml-frontmatter
    exclude: [".gitkeep"]
    operations:
      create: false
      rename: false
      delete: true
    fields:
      - name: name
        label: 이름
        type: string
        readonly: true
      - name: createdAt
        label: 작성일
        type: date
        readonly: true
        options:
          time: true
      - name: approved
        label: 승인 여부
        type: boolean
      - name: body
        label: 메시지
        type: text
        readonly: true
    view:
      fields: [name, createdAt, approved]
      primary: name
      sort: [createdAt]
      default:
        sort: createdAt
        order: desc
